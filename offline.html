<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sin conexión</title>

<style>

body{

background:#0d1117;

color:#fff;

font-family:Arial;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

margin:0;

text-align:center;

}

.card{

max-width:500px;

padding:40px;

border:1px solid #00ff41;

border-radius:10px;

box-shadow:0 0 30px rgba(0,255,65,.3);

}

h1{

color:#00ff41;

}

button{

margin-top:25px;

padding:12px 25px;

background:#00ff41;

border:none;

cursor:pointer;

font-weight:bold;

}

</style>

</head>

<body>

<div class="card">

<h1>📡 Sin conexión</h1>

<p>

Código 404 sigue disponible gracias al modo offline.

</p>

<p>

Cuando vuelva Internet la aplicación continuará funcionando normalmente.

</p>

<button onclick="location.reload()">

Reintentar

</button>

</div>

</body>

</html>
